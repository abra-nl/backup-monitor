name: Build Laravel framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    name: Validate package structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Security audit
        run: composer audit

  code-quality:
    name: Code Quality - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint
        run: composer pint:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Rector (dry-run)
        run: composer rector:dry || true
        continue-on-error: true

  unit-tests:
    name: Unit Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    env:
      APP_ENV: testing
      QUEUE_CONNECTION: sync
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: composer test:unit

  feature-tests:
    name: Feature Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    env:
      APP_ENV: testing
      QUEUE_CONNECTION: sync
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run feature tests
        run: composer test:feature

  coverage:
    name: Code Coverage - PHP 8.3
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]

    env:
      APP_ENV: testing
      QUEUE_CONNECTION: sync
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create coverage directory
        run: mkdir -p build/coverage

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./build/coverage/clover.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Archive coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/
          retention-days: 30

  integration-tests:
    name: Integration & Compatibility - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Test package autoloading
        run: |
          php -r "
            require 'vendor/autoload.php';
            class_exists('AbraNl\\BackupMonitor\\ServiceProvider') or exit(1);
            echo '✅ ServiceProvider class loads successfully\n';
          "

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate-package, code-quality, unit-tests, feature-tests, coverage, integration-tests]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "📊 CI Pipeline Summary"
          echo "====================="

          if [ "${{ needs.validate-package.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.feature-tests.result }}" == "success" ] && \
             [ "${{ needs.coverage.result }}" == "success" ] && \
             [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ All checks passed successfully!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  Package Validation: ${{ needs.validate-package.result }}"
            echo "  Code Quality: ${{ needs.code-quality.result }}"
            echo "  Unit Tests: ${{ needs.unit-tests.result }}"
            echo "  Feature Tests: ${{ needs.feature-tests.result }}"
            echo "  Coverage: ${{ needs.coverage.result }}"
            echo "  Integration Tests: ${{ needs.integration-tests.result }}"
            exit 1
          fi
